repository_type: pipeline

nf_core_version: 4.1.0

lint:
  files_unchanged:
    - CODE_OF_CONDUCT.md
    - assets/nf-core-selenoproteins_logo_light.png
    - docs/images/nf-core-selenoproteins_logo_light.png
    - docs/images/nf-core-selenoproteins_logo_dark.png
    - .github/ISSUE_TEMPLATE/bug_report.yml
    - .github/PULL_REQUEST_TEMPLATE.md
    - assets/email_template.txt
    - docs/README.md
    - .prettierignore
  nextflow_config:
    - manifest.name
    - manifest.homePage
  multiqc_config:
    - report_comment
  files_exist:
    - conf/igenomes.config
    - conf/igenomes_ignored.config
    - CODE_OF_CONDUCT.md
    - assets/nf-core-selenoproteins_logo_light.png
    - docs/images/nf-core-selenoproteins_logo_light.png
    - docs/images/nf-core-selenoproteins_logo_dark.png
    - .github/ISSUE_TEMPLATE/config.yml
    - .github/workflows/awstest.yml
    - .github/workflows/awsfulltest.yml

template:
  org: oist
  name: selenoproteins
  description: Annotation of selenoprotein genes, Sec machinery and tRNA-Sec in genome assemblies
  author: Charles Plessy
  version: 0.1.0
  force: true
  outdir: .
  skip_features:
    - igenomes
    - fastqc
    - gpu
    - rocrate
  is_nfcore: false
